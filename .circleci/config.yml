jobs:
  defun-query-scope:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: For tomorrow poll the battery level
          command: |
            mkdir -p /tmp/data/final
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | tr -dc 'bcdfghjklmnpqrstvwxyz' | fold -w 25 > /tmp/data/final/access.log.8; true
            md5sum /tmp/data/final/access.log.8 > /dev/null && echo "md5 verified"
      - persist_to_workspace:
          root: /tmp/data/final
          paths:
            - 'access.log.8'
  java17-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/data/final
      - run:
          name: Receive 5
          command: |
            cat /tmp/data/final/worker937 2>/dev/null | tr '\n' '\0' | od -An -c | head -2 || true
      - run:
          name: Checkout main
          command: git clone --depth 2 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: tar -xf main-ledger.tar
      - run:
          command: ls -la
      - run:
          name: Cooldown
          command: free -m
      - run:
          command: "./module-beta"
